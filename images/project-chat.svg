<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Illustration of a TCP/IP chat application window with message bubbles and a network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#120c24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#7dd3fc" fill-opacity="0.22"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#dots)"/>
  <circle cx="660" cy="90" r="220" fill="url(#halo)"/>
  <circle cx="120" cy="440" r="200" fill="url(#halo)" opacity="0.6"/>

  <!-- network nodes -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.25">
    <path d="M60 90 L150 60 L210 120 L150 170 L60 90Z"/>
    <path d="M150 60 L150 170 M60 90 L210 120"/>
    <path d="M640 420 L720 380 L750 450 L690 480 L640 420Z"/>
    <path d="M330 60 L390 90 L360 150"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.65">
    <circle cx="60" cy="90" r="3.5"/><circle cx="150" cy="60" r="3"/><circle cx="210" cy="120" r="3.5"/>
    <circle cx="150" cy="170" r="3"/><circle cx="640" cy="420" r="3.5"/><circle cx="720" cy="380" r="3"/>
    <circle cx="750" cy="450" r="3"/><circle cx="690" cy="480" r="2.5"/>
  </g>

  <!-- app window -->
  <g>
    <rect x="105" y="105" width="590" height="330" rx="18" fill="#0b1626" stroke="#2a4466" stroke-opacity="0.9"/>
    <rect x="105" y="105" width="590" height="52" rx="18" fill="#122036"/>
    <rect x="105" y="140" width="590" height="17" fill="#122036"/>
    <circle cx="133" cy="131" r="5" fill="#f87171"/>
    <circle cx="151" cy="131" r="5" fill="#fbbf24"/>
    <circle cx="169" cy="131" r="5" fill="#34d399"/>
    <text x="210" y="136" font-family="Consolas, monospace" font-size="13" fill="#7dd3fc">LAN Chat — #general</text>
    <circle cx="648" cy="131" r="5" fill="#34d399"/>
    <text x="590" y="136" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">online</text>

    <!-- chat history -->
    <g>
      <rect x="130" y="180" width="250" height="44" rx="12" fill="#16263d"/>
      <text x="146" y="198" font-family="Segoe UI, sans-serif" font-size="10" fill="#67e8f9">alice</text>
      <text x="146" y="214" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Hello from the other laptop!</text>

      <rect x="420" y="238" width="250" height="44" rx="12" fill="url(#cyan)" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="436" y="256" font-family="Segoe UI, sans-serif" font-size="10" fill="#67e8f9">you</text>
      <text x="436" y="272" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">Connection established.</text>

      <rect x="130" y="296" width="290" height="44" rx="12" fill="#16263d"/>
      <text x="146" y="314" font-family="Segoe UI, sans-serif" font-size="10" fill="#a78bfa">bob</text>
      <text x="146" y="330" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Typing indicator is working too.</text>

      <g fill="#22d3ee" opacity="0.8">
        <circle cx="146" cy="365" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0s"/></circle>
        <circle cx="162" cy="365" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.2s"/></circle>
        <circle cx="178" cy="365" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.4s"/></circle>
      </g>
    </g>

    <!-- input bar -->
    <rect x="130" y="388" width="430" height="28" rx="14" fill="#0e1c2f" stroke="#2a4466" stroke-opacity="0.7"/>
    <text x="146" y="406" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Type a message...</text>
    <circle cx="640" cy="402" r="16" fill="url(#cyan)"/>
    <path d="M634 402 L646 402 M641 397 L646 402 L641 407" fill="none" stroke="#04111a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- glow accents -->
  <circle cx="700" cy="250" r="90" fill="#a78bfa" fill-opacity="0.12" filter="url(#soft)"/>
  <circle cx="80" cy="300" r="70" fill="#22d3ee" fill-opacity="0.12" filter="url(#soft)"/>
</svg>
