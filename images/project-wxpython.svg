<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Illustration of a wxPython desktop application window with a sidebar, form and chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120"/>
      <stop offset="1" stop-color="#140d26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#7dd3fc" fill-opacity="0.2"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#dots)"/>
  <circle cx="670" cy="110" r="220" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="130" cy="450" r="190" fill="#a78bfa" fill-opacity="0.14" filter="url(#soft)"/>

  <!-- desktop window -->
  <g>
    <rect x="82" y="96" width="636" height="340" rx="18" fill="#0c1626" stroke="#2b4666" stroke-opacity="0.95"/>
    <rect x="82" y="96" width="636" height="44" rx="18" fill="#122036"/>
    <rect x="82" y="122" width="636" height="18" fill="#122036"/>
    <circle cx="108" cy="118" r="4.5" fill="#f87171"/>
    <circle cx="124" cy="118" r="4.5" fill="#fbbf24"/>
    <circle cx="140" cy="118" r="4.5" fill="#34d399"/>
    <text x="170" y="123" font-family="Consolas, monospace" font-size="12" fill="#7dd3fc">wxPython — Desktop Application</text>
    <path d="M690 111 V125 M683 118 H697" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>

    <!-- sidebar -->
    <rect x="82" y="140" width="158" height="296" fill="#0e1a2c"/>
    <path d="M240 140 V436" stroke="#233a56" stroke-width="1"/>
    <g>
      <rect x="100" y="164" width="122" height="34" rx="9" fill="url(#accent)" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.4"/>
      <circle cx="116" cy="181" r="4" fill="#22d3ee"/>
      <text x="128" y="185" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">Dashboard</text>
    </g>
    <g>
      <circle cx="116" cy="219" r="4" fill="#475569"/>
      <text x="128" y="223" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Records</text>
      <circle cx="116" cy="253" r="4" fill="#475569"/>
      <text x="128" y="257" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Reports</text>
      <circle cx="116" cy="287" r="4" fill="#475569"/>
      <text x="128" y="291" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Settings</text>
    </g>
    <rect x="100" y="384" width="122" height="30" rx="8" fill="#13263c" stroke="#2b4666"/>
    <text x="120" y="403" font-family="Segoe UI, sans-serif" font-size="10" fill="#7dd3fc">+ New entry</text>

    <!-- main panel -->
    <text x="266" y="174" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Overview</text>
    <text x="266" y="192" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Event-driven desktop interface built with Python</text>

    <!-- stat cards -->
    <g>
      <rect x="266" y="210" width="130" height="58" rx="10" fill="#112137" stroke="#26405e"/>
      <text x="280" y="231" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">RECORDS</text>
      <text x="280" y="254" font-family="Outfit, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#67e8f9">1,284</text>
      <rect x="410" y="210" width="130" height="58" rx="10" fill="#112137" stroke="#26405e"/>
      <text x="424" y="231" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">ACTIVE</text>
      <text x="424" y="254" font-family="Outfit, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#c4b5fd">342</text>
      <rect x="554" y="210" width="140" height="58" rx="10" fill="#112137" stroke="#26405e"/>
      <text x="568" y="231" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">STATUS</text>
      <circle cx="574" cy="250" r="4" fill="#34d399"/>
      <text x="584" y="254" font-family="Segoe UI, sans-serif" font-size="12" fill="#a7f3d0">Running</text>
    </g>

    <!-- chart -->
    <rect x="266" y="286" width="290" height="130" rx="12" fill="#112137" stroke="#26405e"/>
    <text x="280" y="308" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Monthly activity</text>
    <g fill="url(#accent)">
      <rect x="288" y="356" width="18" height="36" rx="4" opacity="0.55"/>
      <rect x="318" y="344" width="18" height="48" rx="4" opacity="0.7"/>
      <rect x="348" y="332" width="18" height="60" rx="4" opacity="0.8"/>
      <rect x="378" y="348" width="18" height="44" rx="4" opacity="0.65"/>
      <rect x="408" y="320" width="18" height="72" rx="4"/>
      <rect x="438" y="338" width="18" height="54" rx="4" opacity="0.75"/>
      <rect x="468" y="312" width="18" height="80" rx="4"/>
      <rect x="498" y="330" width="18" height="62" rx="4" opacity="0.8"/>
    </g>
    <path d="M288 386 H524" stroke="#26405e"/>

    <!-- form panel -->
    <rect x="570" y="286" width="124" height="130" rx="12" fill="#112137" stroke="#26405e"/>
    <text x="582" y="306" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">QUICK ENTRY</text>
    <rect x="582" y="316" width="100" height="20" rx="5" fill="#0c1a2b" stroke="#2b4666"/>
    <text x="590" y="330" font-family="Segoe UI, sans-serif" font-size="8" fill="#475569">Name...</text>
    <rect x="582" y="342" width="100" height="20" rx="5" fill="#0c1a2b" stroke="#2b4666"/>
    <text x="590" y="356" font-family="Segoe UI, sans-serif" font-size="8" fill="#475569">Course...</text>
    <rect x="582" y="370" width="100" height="24" rx="6" fill="url(#accent)"/>
    <text x="606" y="386" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#06111e">Save</text>
  </g>

  <!-- floating label -->
  <g>
    <rect x="548" y="446" width="142" height="28" rx="14" fill="#101d2f" stroke="#22d3ee" stroke-opacity="0.3"/>
    <circle cx="564" cy="460" r="3.5" fill="#22d3ee"/>
    <text x="574" y="464" font-family="Consolas, monospace" font-size="10" fill="#7dd3fc">Python + wxPython</text>
  </g>
  <g>
    <rect x="104" y="452" width="118" height="28" rx="14" fill="#1c1233" stroke="#a78bfa" stroke-opacity="0.35"/>
    <circle cx="120" cy="466" r="3.5" fill="#a78bfa"/>
    <text x="130" y="470" font-family="Consolas, monospace" font-size="10" fill="#c4b5fd">OOP + events</text>
  </g>
</svg>
